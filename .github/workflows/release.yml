# Release and recovery: https://github.com/nlibjs/actions#release-procedure
# npm Trusted Publisher: nlibjs/changelog, release.yml, environment: empty.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [verify, stage]
        default: verify
        required: true
      tag:
        description: "Published Release tag for retry, e.g. v1.2.3"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  Verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    permissions:
      contents: read
    uses: nlibjs/actions/.github/workflows/npm-release.yml@cde77910e399ec821de29a242f01e44311461605
    with:
      action: verify
  Stage:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.action == 'stage'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: nlibjs/actions/.github/workflows/npm-release.yml@cde77910e399ec821de29a242f01e44311461605
    with:
      action: stage
      tag: ${{ github.event.release.tag_name || inputs.tag }}
